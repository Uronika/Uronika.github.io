<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F3ED" />
  <meta name="description" content="Uronika 简历—工作经历、教育背景与专业技能。 />
  <meta property="og:title" content="简历· Uronika" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>简历· Uronika</title>
</head>
<body class="loading">
  <header class="site-header">
    <div class="grid">
      <a class="wordmark" href="/">Uronika</a>
      <nav aria-label="主要导航">
        <a href="/">首页</a>
        <a href="/works/">作品</a>
        <a href="/resume/" aria-current="page">简历</a>
        <a href="/contact/">联系</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="work-detail">
      <h1 class="text-display" style="margin-bottom:var(--space-1);">简历</h1>
      <p class="text-body" style="margin-bottom:var(--space-5);">
        职业摘要待补充：请使用可验证的事实说明目标职位、经验重点、擅长领域和希望解决的问题。      </p>

      <!-- Experience -->
      <div class="resume-section">
        <h2 class="text-heading">工作经历</h2>
        <div class="resume-entry">
          <div class="resume-entry__period">时间待补充</div>
          <div>
            <span class="resume-entry__badge">资料待补充<</span>
            <div class="resume-entry__org">公司或组织待补充</div>
            <h3 class="resume-entry__role">职位待补充</h3>
            <p class="resume-entry__desc">职责、行动与可量化成果待补充。</p>
          </div>
        </div>
      </div>

      <!-- Education -->
      <div class="resume-section">
        <h2 class="text-heading">教育背景</h2>
        <div class="resume-entry">
          <div class="resume-entry__period">时间待补充</div>
          <div>
            <span class="resume-entry__badge">资料待补充<</span>
            <div class="resume-entry__org">院校待补充</div>
            <h3 class="resume-entry__role">专业或学位待补充</h3>
            <p class="resume-entry__desc">与目标职位相关的学习、课程或实践待补充。</p>
          </div>
        </div>
      </div>

      <!-- Honors -->
      <div class="resume-section">
        <h2 class="text-heading">荣誉与证也</h2>
        <ul class="resume-list">
          <li>荣誉或证书待补充</li>
        </ul>
      </div>

      <!-- Projects -->
      <div class="resume-section">
        <h2 class="text-heading">代表项目</h2>
        <ul class="resume-list">
          <li>代表项目待补充</li>
        </ul>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="grid">
      <div class="footer-left">© 2026 Uronika</div>
      <div class="footer-right">
        <a class="text-link" href="https://github.com/Uronika" target="_blank" rel="noreferrer">GitHub →</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.min.js" integrity="sha384-Aj7zMVUbqJ2fQ3dZFaKZr5/j5YrBpRwLhppOvF5NVPMmNgkayEf7xMN6RrnlTx/B" crossorigin="anonymous"></script>
  <script src="/js/main.js"></script>
</body>
</html>
